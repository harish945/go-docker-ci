name: CI/CD

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: |
          echo "Building Go application..."
          go build -o main .
          echo "Build successful"

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log - Start Deploy Dev
        run: echo "Starting DEV deployment on branch ${{ github.ref }}"

      - name: Check Secrets Set
        run: |
          if [ -z "${{ secrets.DOCKERUSERNAME }}" ]; then echo "DOCKER_USERNAME is EMPTY"; else echo "DOCKER_USERNAME is set"; fi
          if [ -z "${{ secrets.DOCKERPASSWORD }}" ]; then echo "DOCKER_PASSWORD is EMPTY"; else echo "DOCKER_PASSWORD is set"; fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERUSERNAME }}
          password: ${{ secrets.DOCKERPASSWORD }}

      - name: Log - Docker Login Success
        run: echo "Docker Hub login successful"

      - name: Build and Push (dev)
        run: |
          echo "Building Docker image for DEV..."
          docker build -t ${{ secrets.DOCKERUSERNAME }}/go-app:dev .
          echo "Pushing image to Docker Hub..."
          docker push ${{ secrets.DOCKERUSERNAME }}/go-app:dev
          echo "DEV image pushed successfully: ${{ secrets.DOCKERUSERNAME }}/go-app:dev"

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log - Start Deploy Prod
        run: echo "Starting PROD deployment on branch ${{ github.ref }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERUSERNAME }}
          password: ${{ secrets.DOCKERPASSWORD }}

      - name: Log - Docker Login Success
        run: echo "Docker Hub login successful"

      - name: Build and Push (prod)
        run: |
          echo "Building Docker image for PROD..."
          docker build -t ${{ secrets.DOCKERUSERNAME }}/go-app:prod .
          echo "Pushing image to Docker Hub..."
          docker push ${{ secrets.DOCKERUSERNAME }}/go-app:prod
          echo "PROD image pushed successfully: ${{ secrets.DOCKERUSERNAME }}/go-app:prod"
